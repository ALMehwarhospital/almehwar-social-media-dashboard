name: Audit Apps Script deployments

on:
  push:
    paths:
      - '.github/workflows/audit-appscript.yml'
      - 'scripts/audit-appscript-deployments.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Google credentials
        env:
          CLASPRC_JSON: ${{ secrets.ALMEHWAR_CLASPRC_JSON }}
        run: |
          umask 077
          node scripts/prepare-clasp-credentials.mjs
      - name: Inspect deployment IDs and versions
        run: |
          npm install --global @google/clasp@3.3.0
          cd appscript
          clasp deployments
      - name: Test private Google Sheet access
        run: node scripts/test-sheets-access.mjs
      - name: Inspect deployment access
        run: node scripts/audit-appscript-deployments.mjs
      - name: Inspect credential shape without values
        run: |
          node -e 'const j=require(process.env.HOME+"/.clasprc.json");console.log("Credential keys:",Object.keys(j));console.log("Profile keys:",Object.keys(j.tokens?.default||j.token||{}))'
      - name: Diagnose web app HTTP denial
        run: |
          for id in AKfycbypAHZgLI5YhTnqkw2bviO4-DL446iOP2Sw1cmcLmf5eajComltTpZ4HHzRwIdHN5ef AKfycbyWYEVWvc4pKdV-n5c3sOmz29Kt7Pbhyx1ct0mUmDY8u9jUO7N_IaBfYtVtYAWT7245; do
            curl -L -sS --max-time 15 -D /tmp/headers -o /tmp/body "https://script.google.com/macros/s/$id/exec?section=all" || true
            echo "Deployment ${id:0:8}: $(head -1 /tmp/headers)"
            node scripts/inspect-webapp-response.mjs
          done
