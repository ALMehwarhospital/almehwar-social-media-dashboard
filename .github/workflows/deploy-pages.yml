name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Fetch LIVE website snapshot
        env:
          LIVE_URL: https://script.google.com/macros/s/AKfycbyWYEVWvc4pKdV-n5c3sOmz29Kt7Pbhyx1ct0mUmDY8u9jUO7N_IaBfYtVtYAWT7245/exec
          PUBLISHED_SNAPSHOT_URL: https://almehwarhospital.github.io/almehwar-social-media-dashboard/data/website-live.json
        run: |
          mkdir -p public/data
          if curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            "$LIVE_URL?t=$(date +%s)" \
            -o /tmp/website-live.json && \
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/website-live.json","utf8")); if(!d.success || d.mode!=="LIVE") process.exit(1);'; then
            mv /tmp/website-live.json public/data/website-live.json
            echo "Website LIVE snapshot refreshed from Apps Script."
          else
            echo "Website Apps Script unavailable; preserving the last published LIVE snapshot."
            curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 5 \
              --connect-timeout 20 --max-time 120 \
              "$PUBLISHED_SNAPSHOT_URL?t=$(date +%s)" \
              -o public/data/website-live.json
          fi
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("public/data/website-live.json","utf8")); if(!d.success || d.mode!=="LIVE") throw new Error("Invalid LIVE snapshot"); console.log(`LIVE snapshot ready: ${d.periodMonth} / ${d.generatedAt}`);'

      - name: Refresh LIVE social dashboard snapshot
        env:
          SOCIAL_LIVE_URL: https://script.google.com/macros/s/AKfycbypAHZgLI5YhTnqkw2bviO4-DL446iOP2Sw1cmcLmf5eajComltTpZ4HHzRwIdHN5ef/exec
          PUBLISHED_SOCIAL_URL: https://almehwarhospital.github.io/almehwar-social-media-dashboard/data/social-dashboard-live.json
        run: |
          mkdir -p public/data
          validate_social_snapshot() {
            node - "$1" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const expectedMonth = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Africa/Cairo',
            year: 'numeric',
            month: '2-digit'
          }).format(new Date());
          const generatedAt = Date.parse(data.generatedAt || '');
          const ageHours = (Date.now() - generatedAt) / 36e5;

          if (!data.success || data.mode !== 'LIVE') {
            throw new Error('Invalid social LIVE snapshot');
          }
          if (data.currentMonth !== expectedMonth) {
            throw new Error(`Stale social month: expected ${expectedMonth}, received ${data.currentMonth}`);
          }
          if (!Number.isFinite(generatedAt) || ageHours < -1 || ageHours > 6) {
            throw new Error(`Stale social generatedAt: ${data.generatedAt || 'missing'}`);
          }
          console.log(`Validated social snapshot: ${data.currentMonth} / ${data.generatedAt}`);
          NODE
          }

          if curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$SOCIAL_LIVE_URL?section=all&t=$(date +%s)" \
            -o /tmp/social-dashboard-live.json && \
            validate_social_snapshot /tmp/social-dashboard-live.json; then
            mv /tmp/social-dashboard-live.json public/data/social-dashboard-live.json
            echo "Social LIVE snapshot refreshed from Apps Script."
          else
            echo "Social Apps Script unavailable or stale; checking the last published snapshot."
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "$PUBLISHED_SOCIAL_URL?t=$(date +%s)" \
              -o /tmp/published-social-dashboard-live.json
            validate_social_snapshot /tmp/published-social-dashboard-live.json
            mv /tmp/published-social-dashboard-live.json public/data/social-dashboard-live.json
            echo "Preserved the last published current and fresh social snapshot."
          fi
          validate_social_snapshot public/data/social-dashboard-live.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("public/data/social-dashboard-live.json","utf8")); console.log(`Social snapshot ready: ${d.currentMonth} / content ${d.counts.contentLive} / creative ${d.counts.creative}`);'

      - name: Preserve closed-month history
        env:
          PUBLISHED_DATA_BASE: https://almehwarhospital.github.io/almehwar-social-media-dashboard/data
        run: node scripts/preserve-monthly-history.mjs

      - name: Validate social dashboard payload
        run: npm run validate:social

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
