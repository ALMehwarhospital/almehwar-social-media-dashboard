name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch LIVE website snapshot
        env:
          LIVE_URL: https://script.google.com/macros/s/AKfycbyWYEVWvc4pKdV-n5c3sOmz29Kt7Pbhyx1ct0mUmDY8u9jUO7N_IaBfYtVtYAWT7245/exec
        run: |
          mkdir -p public/data
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            "$LIVE_URL?t=$(date +%s)" \
            -o public/data/website-live.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("public/data/website-live.json","utf8")); if(!d.success || d.mode!=="LIVE") throw new Error("Invalid LIVE snapshot"); console.log(`LIVE snapshot ready: ${d.periodMonth} / ${d.generatedAt}`);'

      - name: Fetch LIVE social dashboard snapshot
        env:
          SOCIAL_LIVE_URL: https://script.google.com/macros/s/AKfycbypAHZgLI5YhTnqkw2bviO4-DL446iOP2Sw1cmcLmf5eajComltTpZ4HHzRwIdHN5ef/exec
        run: |
          mkdir -p public/data
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            "$SOCIAL_LIVE_URL?section=all&t=$(date +%s)" \
            -o public/data/social-dashboard-live.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("public/data/social-dashboard-live.json","utf8")); if(!d.success || d.mode!=="LIVE") throw new Error("Invalid social LIVE snapshot"); console.log(`Social LIVE snapshot ready: ${d.currentMonth} / content ${d.counts.contentLive} / creative ${d.counts.creative}`);'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
