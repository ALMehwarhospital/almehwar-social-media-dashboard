name: Sync Apps Script source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-appscript.yml'
      - 'appscript/current/*.gs'
      - 'appscript/current/appsscript.json'

permissions:
  contents: read

concurrency:
  group: almehwar-appscript-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check authorization
        env:
          CLASPRC_JSON: ${{ secrets.ALMEHWAR_CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo 'ALMEHWAR_CLASPRC_JSON repository secret is missing.' >&2
            exit 1
          fi
      - name: Configure Google credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.ALMEHWAR_CLASPRC_JSON }}
        run: |
          umask 077
          node scripts/prepare-clasp-credentials.mjs
      - name: Install official Apps Script CLI
        run: npm install --global @google/clasp@3.3.0
      - name: Pull the live source for drift check
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-appscript"
          node -e "const fs=require('fs');const config=JSON.parse(fs.readFileSync('appscript/.clasp.json','utf8'));config.rootDir='.';fs.writeFileSync(process.env.RUNNER_TEMP+'/live-appscript/.clasp.json',JSON.stringify(config))"
          cd "$RUNNER_TEMP/live-appscript"
          clasp pull
      - name: Refuse to overwrite edits made outside GitHub
        run: node scripts/check-appscript-drift.mjs '${{ github.event.before }}' "$RUNNER_TEMP/live-appscript" 'fa2dd76c4ebb692cd3877ebdda52f8e15b43d062'
      - name: Push current source to the existing Apps Script project
        working-directory: appscript
        run: clasp push
      - name: Update existing dashboard web app deployments
        working-directory: appscript
        run: |
          clasp deploy -i AKfycbypAHZgLI5YhTnqkw2bviO4-DL446iOP2Sw1cmcLmf5eajComltTpZ4HHzRwIdHN5ef -d "Dashboard source from GitHub ${GITHUB_SHA}"
          clasp deploy -i AKfycbyWYEVWvc4pKdV-n5c3sOmz29Kt7Pbhyx1ct0mUmDY8u9jUO7N_IaBfYtVtYAWT7245 -d "Website dashboard source from GitHub ${GITHUB_SHA}"
